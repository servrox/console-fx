<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1440" viewBox="0 0 1440 1440" role="img" aria-labelledby="title desc">
<title id="title">ConsoleFX landing page with integrated playground — desktop</title>
<desc id="desc">ConsoleFX design mockup. Interface controls and example output are illustrative, not a released application.</desc>
<style>.c7{fill:#1c1830;stroke:none}.c8{fill:#b59aff;font-size:10px;font-weight:600;text-anchor:middle}.c9{fill:#98a4bc;font-size:13px;font-weight:400}.c10{fill:#121724;stroke:#283044}.c11{fill:#f5f5fc;font-size:13px;font-weight:600;text-anchor:middle}.c19{fill:#171d29;stroke:none}.c20{fill:#98a4bc;font-size:11px;font-weight:400}.c28{fill:#b59aff;font-size:12px;font-weight:600}.c29{fill:#f5f5fc;font-size:15px;font-weight:600}.c30{fill:#98a4bc;font-size:12px;font-weight:400}.c39{fill:#f5f5fc;font-size:12px;font-weight:400}.c40{fill:#101622;stroke:#283044}.c51{fill:#98a4bc;font-size:11px;font-weight:600}.c52{fill:#0a0e17;stroke:#283044}.c53{fill:#b59aff;stroke:none}</style>
<defs>
