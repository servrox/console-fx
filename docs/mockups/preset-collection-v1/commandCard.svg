<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img"><title>Command Card — design reference</title><desc>A prominent next step for onboarding, recovery, or a local workflow. Static mockup, not a DevTools screenshot. Sample values are fictional.</desc><rect x="0" y="0" width="720" height="240" fill="#1c242a" rx="12" stroke="#3c4952"/><line x1="109" y1="48" x2="109" y2="105" stroke="#3d5057" stroke-width="1"/><rect x="28" y="126" width="664" height="64" fill="#101920" rx="8" stroke="#374950"/><line x1="31" y1="133" x2="31" y2="183" stroke="#4eaaad" stroke-width="2"/><path d="M45 149l8 7-8 7" fill="none" stroke="#67c3c8" stroke-width="2"/><line x1="630" y1="163" x2="645" y2="163" stroke="#5a747e" stroke-width="2"/><text data-slot="eyebrow" x="32" y="33" fill="#8fa1a8" font-size="10" font-family="DejaVu Sans Mono, monospace" font-weight="400" letter-spacing="2" text-anchor="start">NEXT / ACTION</text><text data-slot="step" x="44" y="91" fill="#657780" font-size="38" font-family="DejaVu Sans Mono, monospace" font-weight="700" letter-spacing="0" text-anchor="start">01</text><text data-slot="title" x="128" y="76" fill="#eff3f4" font-size="29" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" letter-spacing="0" text-anchor="start">Run the test suite</text><text data-slot="instruction" x="128" y="103" fill="#aab9c1" font-size="14" font-family="DejaVu Sans, Arial, sans-serif" font-weight="400" letter-spacing="0" text-anchor="start">Run from the project root.</text><text data-slot="command" x="73" y="167" fill="#dce7e9" font-size="27" font-family="DejaVu Sans Mono, monospace" font-weight="700" letter-spacing="0" text-anchor="start">pnpm test</text><text data-slot="safety" x="32" y="218" fill="#95a8b1" font-size="11" font-family="DejaVu Sans Mono, monospace" font-weight="400" letter-spacing="0" text-anchor="start">Command shown, never executed.</text></svg>
