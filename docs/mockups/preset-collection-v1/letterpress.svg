<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img"><title>Letterpress — design reference</title><desc>A tactile, understated welcome for a craft-focused tool or team. Static mockup, not a DevTools screenshot. Sample values are fictional.</desc><rect x="0" y="0" width="720" height="240" fill="#e8e7dc" rx="12" stroke="#d5d5c8"/><rect x="9" y="9" width="702" height="222" fill="none" rx="8" stroke="#f7f6ec"/><line x1="36" y1="51" x2="684" y2="51" stroke="#d4d5c7" stroke-width="1"/><line x1="36" y1="53" x2="684" y2="53" stroke="#f4f4e9" stroke-width="1"/><rect x="38" y="182" width="51" height="3" fill="#43877b" rx="0" stroke="none"/><circle cx="678" cy="213" r="5" fill="#d5d9cd" stroke="#f5f5ea"/><text data-slot="eyebrow" x="36" y="34" fill="#78786f" font-size="10" font-family="DejaVu Sans Mono, monospace" font-weight="400" letter-spacing="2" text-anchor="start">STUDIO / CONSOLE EDITION</text><text data-slot="title-shadow" x="35.8" y="127.3" fill="#faf9ef" font-size="58" font-family="DejaVu Serif, Georgia, serif" font-weight="700" letter-spacing="0" text-anchor="start" aria-hidden="true">Make it matter.</text><text data-slot="title" x="35" y="126" fill="#464842" font-size="58" font-family="DejaVu Serif, Georgia, serif" font-weight="700" letter-spacing="0" text-anchor="start">Make it matter.</text><text data-slot="subtitle" x="37" y="163" fill="#74776c" font-size="16" font-family="DejaVu Sans, Arial, sans-serif" font-weight="400" letter-spacing="0" text-anchor="start">Thoughtful tools. Everyday work.</text><text data-slot="footer" x="37" y="216" fill="#70776e" font-size="10" font-family="DejaVu Sans Mono, monospace" font-weight="400" letter-spacing="2" text-anchor="start">LESS, BUT CONSIDERED.</text></svg>
