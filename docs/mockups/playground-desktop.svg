<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
<title id="title">ConsoleFX expanded playground — animated SVG design</title>
<desc id="desc">ConsoleFX design mockup. Interface controls and example output are illustrative, not a released application.</desc>
<style>.c7{fill:#1c1830;stroke:none}.c8{fill:#b59aff;font-size:10px;font-weight:600;text-anchor:middle}.c9{fill:#98a4bc;font-size:12px;font-weight:400}.c17{fill:#98a4bc;font-size:11px;font-weight:600}.c18{fill:#0a0e17;stroke:#283044}.c19{fill:#f5f5fc;font-size:12px;font-weight:400}.c20{fill:#0f1521;stroke:#283044}.c22{fill:#f5f5fc;font-size:12px;font-weight:600}.c23{fill:#98a4bc;font-size:10px;font-weight:400}.c29{fill:#98a4bc;font-size:10px;font-weight:700}.c36{fill:#98a4bc;font-size:11px;font-weight:400}.c56{fill:#b59aff;stroke:none}</style>
<defs>
<linearGradient id="rainbow" x1="0" y1="0" x2="1" y2=".4">
<stop stop-color="#64e1ff"/>
<stop offset=".5" stop-color="#b59aff"/>
<stop offset="1" stop-color="#f3a2e8"/>
</linearGradient>
<radialGradient id="halo">
<stop stop-color="#5c328b" stop-opacity=".27"/>
<stop offset="1" stop-color="#080b12" stop-opacity="0"/>
</radialGradient>
<filter id="glow" x="-50%" y="-100%" width="200%" height="300%">
<feGaussianBlur stdDeviation="4" result="blur"/>
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
<circle cx="1" cy="1" r=".7" fill="#29334a"/>
</pattern>
</defs>
